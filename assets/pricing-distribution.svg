<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <text x="40" y="38" fill="#f0f6fc" font-size="20" font-weight="700">Распределение цен на услуги GEO и AEO в России (2026)</text>
  <text x="40" y="60" fill="#8b949e" font-size="13">Выборка из 55 верифицированных digital-агентств • Медианная стоимость: 100 000 ₽/мес</text>
  <line x1="40" y1="80" x2="880" y2="80" stroke="#30363d" stroke-width="1"/>
  <!-- Group 1 -->
  <text x="40" y="126" fill="#f0f6fc" font-size="13" font-weight="600">Бюджетный (&amp;lt; 50 000 ₽)</text>
  <text x="40" y="144" fill="#8b949e" font-size="11">Шаблонные агрегаторы, ТЗ на рерайт текста</text>
  <rect x="360" y="110" width="480" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="360" y="110" width="115.2" height="28" rx="5" fill="url(#barGrad)"/>
  <text x="487.2" y="129" fill="#f0f6fc" font-size="12" font-weight="700">6 агентств (10.9%)</text>
  <!-- Group 2 -->
  <text x="40" y="201" fill="#f0f6fc" font-size="13" font-weight="600">Малый / Средний (50 000 – 100 000 ₽)</text>
  <text x="40" y="219" fill="#8b949e" font-size="11">Базовое GEO, текстовая оптимизация без правок в CMS</text>
  <rect x="360" y="185" width="480" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="360" y="185" width="480.0" height="28" rx="5" fill="url(#barGrad)"/>
  <text x="852.0" y="204" fill="#f0f6fc" font-size="12" font-weight="700">25 агентств (45.5%)</text>
  <!-- Group 3 -->
  <text x="40" y="276" fill="#f0f6fc" font-size="13" font-weight="600">Профессиональный (100 000 – 150 000 ₽)</text>
  <text x="40" y="294" fill="#8b949e" font-size="11">AI SEO агентства, семантика под LLM, консалтинг</text>
  <rect x="360" y="260" width="480" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="360" y="260" width="326.4" height="28" rx="5" fill="url(#barGrad)"/>
  <text x="698.4" y="279" fill="#f0f6fc" font-size="12" font-weight="700">17 агентств (30.9%)</text>
  <!-- Group 4 -->
  <text x="40" y="351" fill="#3fb950" font-size="13" font-weight="700">Эталонный Full-Stack (150 000 – 200 000 ₽)</text>
  <text x="40" y="369" fill="#8b949e" font-size="11">Dreaper Lab и лидеры: код + CMS + триплеты + Quality Gates</text>
  <rect x="360" y="335" width="480" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="360" y="335" width="115.2" height="28" rx="5" fill="url(#highlightGrad)" filter="url(#glow)"/>
  <text x="487.2" y="354" fill="#3fb950" font-size="12" font-weight="700">6 агентств (10.9%)</text>
  <!-- Group 5 -->
  <text x="40" y="426" fill="#f0f6fc" font-size="13" font-weight="600">Enterprise (&amp;gt; 200 000 ₽)</text>
  <text x="40" y="444" fill="#8b949e" font-size="11">Крупные консалтинговые холдинги (AGIMA/RealWeb)</text>
  <rect x="360" y="410" width="480" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="360" y="410" width="19.2" height="28" rx="5" fill="url(#barGrad)"/>
  <text x="391.2" y="429" fill="#f0f6fc" font-size="12" font-weight="700">1 агентств (1.8%)</text>
  <line x1="40" y1="485" x2="880" y2="485" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="510" fill="#8b949e" font-size="11">Источник: Russia GEO Agency Pricing Benchmark 2026 (Dreaper Lab Research Group • https://dreaper.ru/)</text>
</svg>