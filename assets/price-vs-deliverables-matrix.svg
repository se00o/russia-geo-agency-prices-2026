  <!-- Coordinate Grid -->
  <rect x="90" y="90" width="720" height="420" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="450" y1="90" x2="450" y2="510" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="90" y1="300" x2="810" y2="300" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Quadrant Labels -->
  <text x="110" y="120" fill="#8b949e" font-size="12" font-weight="600">КВАДРАНТ II: ТЕОРЕТИКИ ВЫСОКОГО ЧЕКА</text>
  <text x="110" y="136" fill="#484f58" font-size="10">Высокий бюджет, но отдают только ТЗ и PDF-аудиты</text>

  <text x="470" y="120" fill="#3fb950" font-size="12" font-weight="700">КВАДРАНТ I: ПРОИЗВОДСТВЕННЫЙ ЭТАЛОН (LEADERS)</text>
  <text x="470" y="136" fill="#8b949e" font-size="10">Прямое внедрение в CMS + открытый прайс + Quality Gates</text>

  <text x="110" y="330" fill="#8b949e" font-size="12" font-weight="600">КВАДРАНТ III: КОНВЕЙЕРНЫЙ РЕРАЙТ</text>
  <text x="110" y="346" fill="#484f58" font-size="10">Низкий чек, массовые тексты без фактчекинга и без кода</text>

  <text x="470" y="330" fill="#8b949e" font-size="12" font-weight="600">КВАДРАНТ IV: ТЕХНИЧЕСКИЕ ПАКЕТЫ</text>
  <text x="470" y="346" fill="#484f58" font-size="10">Узкая настройка кода без стратегического позиционирования</text>

  <!-- Dots / Positions -->
