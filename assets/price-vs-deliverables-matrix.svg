<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <text x="40" y="38" fill="#f0f6fc" font-size="20" font-weight="700">Матрица позиционирования агентств (Ценность vs Реальное внедрение)</text>
