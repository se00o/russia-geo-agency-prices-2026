  <circle cx="410" cy="210" r="8" fill="#1f6feb"/>
  <text x="320" y="214" fill="#58a6ff" font-size="12" font-weight="600">Rush Agency</text>

  <!-- Pixel Plus: X=380, Y=180 -->
  <circle cx="370" cy="180" r="8" fill="#1f6feb"/>
  <text x="280" y="184" fill="#58a6ff" font-size="12" font-weight="600">Пиксель Плюс</text>

