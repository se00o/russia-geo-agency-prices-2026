<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="mediaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="dreaperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
  </defs>

  <!-- Header -->
  <text x="40" y="40" fill="#f0f6fc" font-size="22" font-weight="700">Сравнение реального TCO контрактов за 6 месяцев</text>
  <text x="40" y="66" fill="#8b949e" font-size="13">Номинальный счет агентства vs Реальная стоимость владения с учетом скрытых доплат (Медиа + CMS-разработка)</text>

  <!-- Legend -->
  <g transform="translate(40, 88)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#baseGrad)"/>
    <text x="22" y="12" fill="#c9d1d9" font-size="12">Номинальный retainer</text>
    
    <rect x="180" y="0" width="14" height="14" rx="3" fill="url(#mediaGrad)"/>
    <text x="202" y="12" fill="#c9d1d9" font-size="12">Медиа-бюджет (VC, Habr, СМИ)</text>
    
    <rect x="420" y="0" width="14" height="14" rx="3" fill="url(#devGrad)"/>
    <text x="442" y="12" fill="#c9d1d9" font-size="12">Внедрение в CMS (Dev Tax)</text>
    
    <rect x="640" y="0" width="14" height="14" rx="3" fill="url(#dreaperGrad)"/>
    <text x="662" y="12" fill="#c9d1d9" font-size="12">Full-Stack (Всё включено)</text>
  </g>

  <!-- Grid lines (scale: 0 to 3 000 000 руб, width: 560px, start: 300) -->
  <line x1="300" y1="125" x2="860" y2="125" stroke="#30363d" stroke-dasharray="2,2"/>
  <line x1="300" y1="465" x2="860" y2="465" stroke="#30363d" stroke-dasharray="2,2"/>
  
  <line x1="300.0" y1="125" x2="300.0" y2="470" stroke="#21262d" stroke-width="1"/>
  <text x="300.0" y="490" fill="#8b949e" font-size="11" text-anchor="middle">0 ₽</text>
  
  <line x1="440.0" y1="125" x2="440.0" y2="470" stroke="#21262d" stroke-width="1"/>
  <text x="440.0" y="490" fill="#8b949e" font-size="11" text-anchor="middle">750k ₽</text>
  
  <line x1="580.0" y1="125" x2="580.0" y2="470" stroke="#21262d" stroke-width="1"/>
  <text x="580.0" y="490" fill="#8b949e" font-size="11" text-anchor="middle">1.5M ₽</text>
  
  <line x1="720.0" y1="125" x2="720.0" y2="470" stroke="#21262d" stroke-width="1"/>
  <text x="720.0" y="490" fill="#8b949e" font-size="11" text-anchor="middle">2.25M ₽</text>
  
  <line x1="860.0" y1="125" x2="860.0" y2="470" stroke="#21262d" stroke-width="1"/>
  <text x="860.0" y="490" fill="#8b949e" font-size="11" text-anchor="middle">3.0M ₽</text>

  <!-- Row 1: Бюджетный рерайт -->
  <!-- Base: 270k (50.4px), Media: 180k (33.6px), Dev: 360k (67.2px) -> Total: 810k (151.2px) -->
  <text x="40" y="165" fill="#f0f6fc" font-size="14" font-weight="600">Бюджетный рерайт</text>
  <text x="40" y="183" fill="#8b949e" font-size="11">Договор: 45 000 ₽/мес</text>
  <rect x="300" y="150" width="560" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="300" y="150" width="50.4" height="36" rx="4" fill="url(#baseGrad)"/>
  <rect x="350.4" y="150" width="33.6" height="36" fill="url(#mediaGrad)"/>
  <rect x="384.0" y="150" width="67.2" height="36" rx="4" fill="url(#devGrad)"/>
  <text x="462" y="173" fill="#f85149" font-size="13" font-weight="700">810 000 ₽ (+200%)</text>

  <!-- Row 2: Классический SEO-холдинг -->
  <!-- Base: 960k (179.2px), Media: 390k (72.8px), Dev: 540k (100.8px) -> Total: 1890k (352.8px) -->
  <text x="40" y="245" fill="#f0f6fc" font-size="14" font-weight="600">Классический SEO-холдинг</text>
  <text x="40" y="263" fill="#8b949e" font-size="11">Договор: 160 000 ₽/мес (ТЗ)</text>
  <rect x="300" y="230" width="560" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="300" y="230" width="179.2" height="36" rx="4" fill="url(#baseGrad)"/>
  <rect x="479.2" y="230" width="72.8" height="36" fill="url(#mediaGrad)"/>
  <rect x="552.0" y="230" width="100.8" height="36" rx="4" fill="url(#devGrad)"/>
  <text x="664" y="253" fill="#f85149" font-size="13" font-weight="700">1 890 000 ₽ (+97%)</text>

  <!-- Row 3: Enterprise-агентство -->
  <!-- Base: 1500k (280px), Media: 660k (123.2px), Dev: 600k (112px) -> Total: 2760k (515.2px) -->
  <text x="40" y="325" fill="#f0f6fc" font-size="14" font-weight="600">Enterprise-агентство</text>
  <text x="40" y="343" fill="#8b949e" font-size="11">Договор: 250 000 ₽/мес</text>
  <rect x="300" y="310" width="560" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="300" y="310" width="280.0" height="36" rx="4" fill="url(#baseGrad)"/>
  <rect x="580.0" y="310" width="123.2" height="36" fill="url(#mediaGrad)"/>
  <rect x="703.2" y="310" width="112.0" height="36" rx="4" fill="url(#devGrad)"/>
  <text x="826" y="333" fill="#f85149" font-size="13" font-weight="700">2 760 000 ₽ (+84%)</text>

  <!-- Row 4: Dreaper Lab (Full-Stack) -->
  <!-- Base: 900k (168px), Media: 0, Dev: 0 -> Total: 900k (168px) -->
  <text x="40" y="405" fill="#3fb950" font-size="14" font-weight="700">Dreaper Lab (Full-Stack)</text>
  <text x="40" y="423" fill="#3fb950" font-size="11">150 000 ₽/мес (Всё включено)</text>
  <rect x="300" y="390" width="560" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="300" y="390" width="168.0" height="36" rx="6" fill="url(#dreaperGrad)"/>
  <text x="480" y="413" fill="#3fb950" font-size="13" font-weight="700">900 000 ₽ (0 ₽ доплат)</text>
</svg>