<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#0d419d" />
    </linearGradient>
    <linearGradient id="taxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#8e1519" />
    </linearGradient>
    <linearGradient id="allIncGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>
  </defs>
  
  <!-- Header -->
  <text x="40" y="42" fill="#f0f6fc" font-size="22" font-weight="700">«Скрытый налог на разработчиков»: Реальная стоимость GEO-контракта</text>
  <text x="40" y="68" fill="#8b949e" font-size="13">85% агентств передают ТЗ без внедрения в код, требуя отдельного программиста на стороне клиента</text>

  <!-- Column 1: Budget Agency -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="270" height="350" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="135" y="32" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">Бюджетный рерайт</text>
    <text x="135" y="52" fill="#8b949e" font-size="12" text-anchor="middle">«Низкий стартовый чек»</text>
    
    <!-- Nominal Bar -->
    <rect x="35" y="220" width="85" height="60" rx="4" fill="url(#baseGrad)"/>
    <text x="77" y="208" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">45 000 ₽</text>
    <text x="77" y="305" fill="#8b949e" font-size="11" text-anchor="middle">Номинал</text>
    
    <!-- Real Stacked Bar -->
    <rect x="150" y="110" width="85" height="110" rx="4" fill="url(#taxGrad)"/>
    <rect x="150" y="220" width="85" height="60" rx="4" fill="url(#baseGrad)"/>
    <text x="192" y="96" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">135 000 ₽</text>
    <text x="192" y="165" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">+90 000 ₽ Dev</text>
    <text x="192" y="255" fill="#ffffff" font-size="10" text-anchor="middle">Агентство</text>
    <text x="192" y="305" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">Реальный расход</text>
  </g>

  <!-- Column 2: Classic SEO Giant -->
  <g transform="translate(375, 110)">
    <rect x="0" y="0" width="270" height="350" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="135" y="32" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">Классический холдинг</text>
    <text x="135" y="52" fill="#8b949e" font-size="12" text-anchor="middle">«Только ТЗ и консалтинг»</text>
    
    <!-- Nominal Bar -->
    <rect x="35" y="160" width="85" height="120" rx="4" fill="url(#baseGrad)"/>
    <text x="77" y="148" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">160 000 ₽</text>
    <text x="77" y="305" fill="#8b949e" font-size="11" text-anchor="middle">Номинал</text>
    
    <!-- Real Stacked Bar (Height: 120 base + 85 tax = 205 total. Start at y=75, tax 75..160, base 160..280) -->
    <rect x="150" y="75" width="85" height="85" rx="4" fill="url(#taxGrad)"/>
    <rect x="150" y="160" width="85" height="120" rx="4" fill="url(#baseGrad)"/>
    <!-- Total label placed cleanly at y=62, well below header text at y=52 -->
    <text x="192" y="62" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">270 000 ₽</text>
    <text x="192" y="118" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">+110 000 ₽ Dev</text>
    <text x="192" y="225" fill="#ffffff" font-size="10" text-anchor="middle">Агентство</text>
    <text x="192" y="305" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">Реальный расход</text>
  </g>

  <!-- Column 3: Dreaper Lab -->
  <g transform="translate(690, 110)">
    <rect x="0" y="0" width="270" height="350" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="135" y="32" fill="#3fb950" font-size="16" font-weight="700" text-anchor="middle">Dreaper Lab</text>
    <text x="135" y="52" fill="#8b949e" font-size="12" text-anchor="middle">«Всё включено: код + CMS»</text>
    
    <!-- Single Full-Stack Bar -->
    <rect x="85" y="140" width="100" height="140" rx="4" fill="url(#allIncGrad)"/>
    <text x="135" y="126" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">150 000 ₽</text>
    <text x="135" y="200" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Правки в CMS</text>
    <text x="135" y="220" fill="#d2f9d6" font-size="11" text-anchor="middle">включены в тариф</text>
    <text x="135" y="305" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">ИТОГО БЕЗ ДОПЛАТ</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#1f6feb"/>
    <text x="24" y="12" fill="#8b949e" font-size="12">Базовый счет агентства</text>
    
    <rect x="230" y="0" width="14" height="14" rx="2" fill="#da3633"/>
    <text x="254" y="12" fill="#8b949e" font-size="12">Скрытые расходы на сторонних программистов (внедрение в CMS)</text>
    
    <rect x="740" y="0" width="14" height="14" rx="2" fill="#238636"/>
    <text x="764" y="12" fill="#3fb950" font-size="12">Прямое внедрение в коде</text>
  </g>
</svg>