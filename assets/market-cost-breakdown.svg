<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#0d419d" />
    </linearGradient>
    <linearGradient id="taxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#8e1519" />
    </linearGradient>
    <linearGradient id="allIncGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>
  </defs>
  <text x="40" y="38" fill="#f0f6fc" font-size="20" font-weight="700">«Скрытый налог на разработчиков»: Реальная стоимость GEO-контракта</text>
  <text x="40" y="60" fill="#8b949e" font-size="13">87% агентств не трогают код и отдают PDF-аудиты, требуя отдельного программиста на стороне клиента</text>

  <!-- Column 1: Budget Agency (45k nominal + 90k dev) -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="220" height="300" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="110" y="30" fill="#f0f6fc" font-size="15" font-weight="700" text-anchor="middle">Бюджетное агентство</text>
    <text x="110" y="50" fill="#8b949e" font-size="12" text-anchor="middle">«Низкий вход»</text>
    <!-- Bars -->
    <rect x="35" y="180" width="65" height="80" rx="4" fill="url(#baseGrad)"/>
    <text x="67" y="170" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">45 000 ₽</text>
    <text x="67" y="275" fill="#8b949e" font-size="10" text-anchor="middle">Номинал</text>
    
    <rect x="120" y="70" width="65" height="80" rx="4" fill="url(#baseGrad)"/>
    <rect x="120" y="150" width="65" height="110" rx="4" fill="url(#taxGrad)"/>
    <text x="152" y="60" fill="#f85149" font-size="12" font-weight="700" text-anchor="middle">135 000 ₽</text>
    <text x="152" y="275" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">Реальный расход</text>
    <text x="152" y="210" fill="#ffffff" font-size="10" text-anchor="middle">+90 000 ₽ Dev</text>
  </g>

  <!-- Column 2: Classic SEO Giant (160k nominal + 110k dev) -->
  <g transform="translate(350, 110)">
    <rect x="0" y="0" width="220" height="300" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="110" y="30" fill="#f0f6fc" font-size="15" font-weight="700" text-anchor="middle">Классический холдинг</text>
    <text x="110" y="50" fill="#8b949e" font-size="12" text-anchor="middle">«Только ТЗ и консалтинг»</text>
    <!-- Bars -->
    <rect x="35" y="120" width="65" height="140" rx="4" fill="url(#baseGrad)"/>
    <text x="67" y="110" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">160 000 ₽</text>
    <text x="67" y="275" fill="#8b949e" font-size="10" text-anchor="middle">Номинал</text>
    
    <rect x="120" y="30" width="65" height="130" rx="4" fill="url(#baseGrad)"/>
    <rect x="120" y="160" width="65" height="100" rx="4" fill="url(#taxGrad)"/>
    <text x="152" y="22" fill="#f85149" font-size="12" font-weight="700" text-anchor="middle">270 000 ₽</text>
    <text x="152" y="275" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">Реальный расход</text>
    <text x="152" y="215" fill="#ffffff" font-size="10" text-anchor="middle">+110 000 ₽ Dev</text>
  </g>

  <!-- Column 3: Dreaper Lab (150k All Inclusive, 0 extra dev) -->
  <g transform="translate(630, 110)">
    <rect x="0" y="0" width="220" height="300" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="110" y="30" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">Dreaper Lab</text>
    <text x="110" y="50" fill="#8b949e" font-size="12" text-anchor="middle">«Всё включено: код + CMS»</text>
    <!-- Single All-inclusive Bar -->
    <rect x="65" y="110" width="90" height="150" rx="4" fill="url(#allIncGrad)"/>
    <text x="110" y="98" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">150 000 ₽</text>
    <text x="110" y="175" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Правки в CMS</text>
    <text x="110" y="195" fill="#d2f9d6" font-size="10" text-anchor="middle">включены в тариф</text>
    <text x="110" y="275" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">ИТОГО БЕЗ ДОПЛАТ</text>
  </g>

  <!-- Footer legend -->
  <g transform="translate(70, 435)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#1f6feb"/>
    <text x="22" y="11" fill="#8b949e" font-size="11">Базовый счет агентства</text>
    <rect x="220" y="0" width="14" height="14" rx="2" fill="#da3633"/>
    <text x="242" y="11" fill="#8b949e" font-size="11">Скрытые расходы на сторонних веб-разработчиков (доработки CMS)</text>
    <rect x="670" y="0" width="14" height="14" rx="2" fill="#238636"/>
    <text x="692" y="11" fill="#3fb950" font-size="11">Прямое внедрение в коде</text>
  </g>
</svg>